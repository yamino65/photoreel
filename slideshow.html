<title>フォトリール</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  /* レイアウト: 上から「写真を選ぶ → 秒数 → 見せ方 → 再生」の一本道。再生中は全画面のプレイヤーが上に重なる */
  :root {
    --bg: #15131a;          /* 暗室のような背景（写真が映える） */
    --surface: #201d27;
    --line: #34303d;
    --fg: #f1ede6;
    --muted: #a29cab;
    --accent: #f0b54a;      /* 映写機のランプの琥珀色 */
    --accent-ink: #1e1606;
    --danger: #ff7a6b;
    --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
    --font-body: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding-block: 28px 120px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  header h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.02em;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 .reel {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid var(--accent);
    background:
      radial-gradient(circle at 50% 50%, var(--accent) 0 3px, transparent 4px),
      radial-gradient(circle at 50% 22%, var(--bg) 0 3.5px, transparent 4.5px),
      radial-gradient(circle at 50% 78%, var(--bg) 0 3.5px, transparent 4.5px),
      radial-gradient(circle at 22% 50%, var(--bg) 0 3.5px, transparent 4.5px),
      radial-gradient(circle at 78% 50%, var(--bg) 0 3.5px, transparent 4.5px),
      var(--surface);
  }
  header p { margin: 6px 0 0; color: var(--muted); }

  section { display: flex; flex-direction: column; gap: 12px; }
  .label-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    margin: 0;
  }
  .hint { color: var(--muted); font-size: 13px; }

  /* ボタン類 */
  button, .btn {
    font: inherit;
    color: inherit;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 12px;
    padding: 10px 14px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:focus-visible, .btn:focus-within, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .pick-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn.primary-pick {
    flex: 1 1 200px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--fg); color: var(--bg); border-color: var(--fg);
    font-weight: 700; padding: 14px;
    position: relative;
  }
  .btn.primary-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .ghost { background: transparent; color: var(--muted); }

  /* サムネイル一覧 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 6px;
  }
  .thumb {
    position: relative;
    aspect-ratio: 1;
    max-width: 100%;
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .num {
    position: absolute; left: 4px; bottom: 4px;
    font-size: 11px; font-variant-numeric: tabular-nums;
    background: rgba(0,0,0,.6); color: #fff; padding: 0 5px; border-radius: 4px;
  }
  .thumb .rm {
    position: absolute; top: 3px; right: 3px;
    width: 24px; height: 24px; padding: 0; border-radius: 50%;
    border: none; background: rgba(0,0,0,.6); color: #fff; font-size: 14px; line-height: 24px;
  }
  .sample-note {
    font-size: 13px; color: var(--accent);
    border: 1px dashed var(--accent); border-radius: 10px; padding: 8px 12px;
  }

  /* 秒数 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-width: 56px; padding: 8px 12px; border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .custom-sec {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px;
  }
  .custom-sec input {
    width: 5.5em; font: inherit; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;
    background: transparent; color: var(--fg); border: none; text-align: right;
  }
  .custom-sec span { color: var(--muted); }

  /* 見せ方の設定 */
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt.wide { grid-column: 1 / -1; }
  @media (max-width: 420px) { .opts { grid-template-columns: 1fr; } }
  .opt {
    display: flex; flex-direction: column; gap: 4px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  }
  .opt label { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
  .opt select {
    font: inherit; color: var(--fg); background: transparent; border: none; padding: 2px 0;
    appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 10px) 55%, calc(100% - 5px) 55%;
    background-size: 5px 5px; background-repeat: no-repeat;
  }
  .opt select option { background: var(--surface); }

  /* 再生ボタン（画面下に固定） */
  .start-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-top: 12px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(to top, var(--bg) 65%, transparent);
    display: flex; justify-content: center;
  }
  .start {
    width: 100%; max-width: 640px;
    background: var(--accent); color: var(--accent-ink); border: none;
    font-family: var(--font-display); font-weight: 700; font-size: 18px;
    padding: 15px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .start small { font-family: var(--font-body); font-weight: 500; opacity: .75; font-size: 13px; }
  .start:disabled { opacity: .4; }

  /* ===== プレイヤー ===== */
  #player {
    position: fixed; inset: 0; z-index: 50;
    background: #000; color: #fff;
    overflow: hidden;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  .stage { position: absolute; inset: 0; }
  .layer {
    position: absolute; inset: 0; width: 100%; height: 100%; max-width: none;
    object-fit: contain;
    opacity: 0;
    transition: opacity var(--fade, 800ms) ease;
    will-change: opacity, transform;
  }
  #player.fit-cover .layer { object-fit: cover; }
  .layer.on { opacity: 1; }
  #player.trans-none .layer { transition: none; }
  .layer.kb { animation: kenburns var(--kb-dur, 6s) linear forwards; }
  @keyframes kenburns {
    from { transform: scale(1) translate(0, 0); }
    to   { transform: scale(1.12) translate(var(--kx, 0%), var(--ky, 0%)); }
  }

  .hud { position: absolute; left: 0; right: 0; transition: opacity .3s ease; }
  #player.hud-hidden .hud { opacity: 0; pointer-events: none; }
  #player.hud-hidden { cursor: none; }
  .hud-top {
    top: 0;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: 30px;
    background: linear-gradient(to bottom, rgba(0,0,0,.6), transparent);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .counter { font-variant-numeric: tabular-nums; font-size: 14px; opacity: .9; }
  .hud-bottom {
    bottom: 0;
    padding-top: 40px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(to top, rgba(0,0,0,.65), transparent);
    display: flex; flex-direction: column; gap: 14px; align-items: center;
  }
  .controls { display: flex; align-items: center; gap: 22px; }
  .icon-btn {
    width: 52px; height: 52px; border-radius: 50%; padding: 0;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); color: #fff;
    display: grid; place-items: center;
  }
  .icon-btn.big { width: 66px; height: 66px; background: var(--accent); color: var(--accent-ink); border: none; }
  .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }
  .icon-btn.big svg { width: 28px; height: 28px; }
  .close-btn { width: 40px; height: 40px; }
  .close-btn svg { width: 18px; height: 18px; }
  .sec-badge { font-size: 13px; font-variant-numeric: tabular-nums; opacity: .85; }
  .top-right { display: flex; align-items: center; gap: 10px; }
  .fs-btn {
    display: flex; align-items: center; gap: 6px;
    background: var(--accent); color: var(--accent-ink); border: none;
    border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px;
  }
  .fs-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .vm-video {
    position: absolute; left: 0; bottom: 0; width: 2px; height: 2px;
    opacity: 0.01; pointer-events: none;
  }

  .toast {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,.7); padding: 10px 18px; border-radius: 12px; font-size: 14px;
    pointer-events: none; transition: opacity .3s;
  }

  @media (prefers-reduced-motion: reduce) {
    .layer { transition: none; }
    .layer.kb { animation: none; }
  }
</style>

<main class="wrap">
  <header>
    <h1><span class="reel" aria-hidden="true"></span>フォトリール</h1>
    <p>iPhoneの写真を選んで、1枚ごとの表示秒数を決めて再生します。</p>
  </header>

  <section aria-labelledby="h-photos">
    <div class="label-row">
      <h2 id="h-photos">1. 写真を選ぶ</h2>
      <span class="hint" id="photoCount">0枚</span>
    </div>
    <div class="pick-row">
      <label class="btn primary-pick">
        <span id="pickLabel">＋ 写真ライブラリから選ぶ</span>
        <input id="fileInput" type="file" accept="image/*" multiple>
      </label>
      <button id="clearBtn" class="ghost" type="button" hidden>すべて外す</button>
    </div>
    <p class="hint" style="margin:0">選ぶ画面の「アルバム」タブで、アルバムごとに写真を開けます。</p>
    <div id="sampleNote" class="sample-note">いま並んでいるのはお試し用のサンプル画像です。写真を選ぶと入れ替わります。</div>
    <div id="grid" class="grid" aria-live="polite"></div>
  </section>

  <section aria-labelledby="h-sec">
    <h2 id="h-sec">2. 1枚あたりの表示秒数</h2>
    <div class="chips" id="chips">
      <button type="button" class="chip" data-sec="1">1秒</button>
      <button type="button" class="chip" data-sec="3">3秒</button>
      <button type="button" class="chip" data-sec="5">5秒</button>
      <button type="button" class="chip" data-sec="10">10秒</button>
      <button type="button" class="chip" data-sec="30">30秒</button>
      <button type="button" class="chip" data-sec="60">1分</button>
    </div>
    <label class="custom-sec" for="secInput">
      <span>自由に入力</span>
      <input id="secInput" type="number" inputmode="decimal" min="0.5" max="3600" step="0.5" value="5">
      <span>秒</span>
    </label>
  </section>

  <section aria-labelledby="h-opt">
    <h2 id="h-opt">3. 見せ方</h2>
    <div class="opts">
      <div class="opt">
        <label for="orderSel">順番</label>
        <select id="orderSel">
          <option value="pick">選んだ順</option>
          <option value="shuffle">シャッフル</option>
        </select>
      </div>
      <div class="opt">
        <label for="fitSel">表示サイズ</label>
        <select id="fitSel">
          <option value="contain">写真全体を表示</option>
          <option value="cover">画面いっぱい（端を切る）</option>
        </select>
      </div>
      <div class="opt">
        <label for="transSel">切り替え</label>
        <select id="transSel">
          <option value="fade">フェード</option>
          <option value="kenburns">フェード＋ゆっくりズーム</option>
          <option value="none">パッと切り替え</option>
        </select>
      </div>
      <div class="opt">
        <label for="fadeSel">フェードの長さ</label>
        <select id="fadeSel">
          <option value="0.5">0.5秒（さっと）</option>
          <option value="1">1秒</option>
          <option value="2">2秒</option>
          <option value="3">3秒</option>
          <option value="5">5秒（じんわり）</option>
        </select>
      </div>
      <div class="opt">
        <label for="loopSel">最後まで行ったら</label>
        <select id="loopSel">
          <option value="loop">最初から繰り返す</option>
          <option value="stop">止まる</option>
        </select>
      </div>
      <div class="opt">
        <label for="vmodeSel">全画面の方式</label>
        <select id="vmodeSel">
          <option value="normal">ふつう</option>
          <option value="video">動画モード（時刻・電池も隠す）</option>
        </select>
      </div>
    </div>
    <p class="hint" id="vmodeHint" style="margin:0" hidden>動画モードは試作中です。再生画面の右上の「全画面」を押すと、iPhoneの動画プレーヤーで全画面になります。</p>
  </section>
</main>

<div class="start-bar">
  <button id="startBtn" class="start" type="button">▶ 再生する <small id="startInfo"></small></button>
</div>

<!-- 再生画面 -->
<div id="player" hidden>
  <div class="stage" id="stage">
    <img class="layer" id="layerA" alt="">
    <img class="layer" id="layerB" alt="">
  </div>
  <div class="hud hud-top">
    <span class="counter" id="counter">1 / 1</span>
    <div class="top-right">
      <button class="fs-btn" id="fsBtn" type="button" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg>
        全画面
      </button>
      <button class="icon-btn close-btn" id="closeBtn" type="button" aria-label="閉じる">
        <svg viewBox="0 0 24 24"><path d="M5.3 4 12 10.7 18.7 4 20 5.3 13.3 12 20 18.7 18.7 20 12 13.3 5.3 20 4 18.7 10.7 12 4 5.3z"/></svg>
      </button>
    </div>
  </div>
  <!-- 動画モード用：スライドショーを描いた動画。ほぼ見えない大きさで置いておき、全画面ボタンでこれを拡大する -->
  <video id="vmVideo" class="vm-video" muted playsinline></video>
  <div class="hud hud-bottom">
    <div class="controls">
      <button class="icon-btn" id="prevBtn" type="button" aria-label="前の写真">
        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button class="icon-btn big" id="playBtn" type="button" aria-label="一時停止">
        <svg viewBox="0 0 24 24" id="playIcon"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
      </button>
      <button class="icon-btn" id="nextBtn" type="button" aria-label="次の写真">
        <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
    </div>
    <span class="sec-badge" id="secBadge"></span>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
(() => {
  // ===== 要素の取得 =====
  const $ = (id) => document.getElementById(id);
  const fileInput = $("fileInput"), grid = $("grid"), photoCount = $("photoCount");
  const clearBtn = $("clearBtn"), sampleNote = $("sampleNote"), pickLabel = $("pickLabel");
  const chips = $("chips"), secInput = $("secInput");
  const orderSel = $("orderSel"), transSel = $("transSel"), fitSel = $("fitSel"), loopSel = $("loopSel");
  const fadeSel = $("fadeSel"), vmodeSel = $("vmodeSel"), vmodeHint = $("vmodeHint");
  const fsBtn = $("fsBtn"), vmVideo = $("vmVideo");
  const startBtn = $("startBtn"), startInfo = $("startInfo");
  const player = $("player"), layers = [$("layerA"), $("layerB")];
  const counter = $("counter"), secBadge = $("secBadge"), toast = $("toast");
  const playBtn = $("playBtn"), playIcon = $("playIcon");

  const ICON_PAUSE = '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>';
  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';

  // ===== 状態 =====
  // items: { url: 表示用URL, thumb: サムネイルURL, sample: サンプルかどうか }
  let items = [];
  let usingSamples = true;

  // ===== 設定の保存・読み込み（使えない環境でも動くよう try/catch） =====
  const STORE_KEY = "photoreel-settings";
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
      if (s.sec) secInput.value = s.sec;
      if (s.order) orderSel.value = s.order;
      if (s.trans) transSel.value = s.trans;
      if (s.fit) fitSel.value = s.fit;
      if (s.loop) loopSel.value = s.loop;
      if (s.vmode) vmodeSel.value = s.vmode;
      fadeSel.value = s.fade || "2";
    } catch (e) { fadeSel.value = "2"; /* 保存できない環境では初期値のまま */ }
    syncFadeSel();
    vmodeHint.hidden = vmodeSel.value !== "video";
  }
  function saveSettings() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        sec: secInput.value, order: orderSel.value, trans: transSel.value,
        fit: fitSel.value, loop: loopSel.value, fade: fadeSel.value, vmode: vmodeSel.value,
      }));
    } catch (e) { /* 無視 */ }
  }
  // 「パッと切り替え」のときはフェードの長さを選べないようにする
  function syncFadeSel() { fadeSel.disabled = transSel.value === "none"; }
  transSel.addEventListener("change", syncFadeSel);

  // ===== 秒数の扱い =====
  function getSec() {
    const v = parseFloat(secInput.value);
    if (!isFinite(v)) return 5;
    return Math.min(3600, Math.max(0.5, v)); // 0.5秒〜1時間に収める
  }
  function formatSec(s) {
    if (s >= 60 && s % 60 === 0) return `${s / 60}分`;
    return `${s}秒`;
  }
  function formatTotal(totalSec) {
    const m = Math.floor(totalSec / 60), s = Math.round(totalSec % 60);
    return m > 0 ? `合計 約${m}分${s ? s + "秒" : ""}` : `合計 約${s}秒`;
  }
  function syncChips() {
    const s = getSec();
    chips.querySelectorAll(".chip").forEach((c) => {
      c.setAttribute("aria-pressed", String(parseFloat(c.dataset.sec) === s));
    });
    updateSummary();
  }
  chips.addEventListener("click", (e) => {
    const c = e.target.closest(".chip");
    if (!c) return;
    secInput.value = c.dataset.sec;
    syncChips(); saveSettings();
  });
  secInput.addEventListener("input", () => { syncChips(); saveSettings(); });
  secInput.addEventListener("change", () => { secInput.value = getSec(); syncChips(); });
  vmodeSel.addEventListener("change", () => { vmodeHint.hidden = vmodeSel.value !== "video"; });
  [orderSel, transSel, fitSel, loopSel, fadeSel, vmodeSel].forEach((el) => el.addEventListener("change", saveSettings));

  // ===== サンプル画像を canvas で作る =====
  const SAMPLES = [
    { a: "#ff9a5a", b: "#5a2a6e", label: "夕焼けの海" },
    { a: "#9fe0c8", b: "#1f5b5e", label: "朝の森" },
    { a: "#ffd36e", b: "#d0603a", label: "パン屋の朝" },
    { a: "#a7c1ff", b: "#2a2f6e", label: "冬の夜" },
    { a: "#ffc2d1", b: "#7a3b5c", label: "春の公園" },
  ];
  function makeSample(s, i) {
    return new Promise((resolve) => {
      const c = document.createElement("canvas");
      c.width = 1200; c.height = 800;
      const g = c.getContext("2d");
      const grad = g.createLinearGradient(0, 0, 0, 800);
      grad.addColorStop(0, s.a); grad.addColorStop(1, s.b);
      g.fillStyle = grad; g.fillRect(0, 0, 1200, 800);
      // 丸い光（太陽や月のイメージ）
      g.fillStyle = "rgba(255,255,255,.35)";
      g.beginPath(); g.arc(300 + i * 160, 320, 110, 0, Math.PI * 2); g.fill();
      // 丘のシルエット
      g.fillStyle = "rgba(0,0,0,.22)";
      g.beginPath(); g.moveTo(0, 620);
      for (let x = 0; x <= 1200; x += 40) g.lineTo(x, 600 + Math.sin(x / 140 + i) * 40);
      g.lineTo(1200, 800); g.lineTo(0, 800); g.fill();
      g.fillStyle = "#fff";
      g.font = "bold 64px 'Hiragino Sans', sans-serif";
      g.fillText(s.label, 70, 140);
      g.font = "32px sans-serif";
      g.fillText(`サンプル ${i + 1} / ${SAMPLES.length}`, 70, 195);
      c.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        resolve({ url, thumb: url, sample: true });
      }, "image/jpeg", 0.85);
    });
  }
  async function loadSamples() {
    items = await Promise.all(SAMPLES.map(makeSample));
    usingSamples = true;
    renderGrid();
  }

  // ===== 写真の読み込み =====
  // 大きな写真をそのままサムネイルにするとiPhoneのメモリを圧迫するので、小さく縮めてから並べる
  function makeThumb(url) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const size = 200;
        const scale = size / Math.min(img.naturalWidth, img.naturalHeight);
        const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
        const c = document.createElement("canvas");
        c.width = size; c.height = size;
        c.getContext("2d").drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        c.toBlob((b) => resolve(b ? URL.createObjectURL(b) : url), "image/jpeg", 0.7);
        img.src = ""; // 元画像のデコード結果を手放す
      };
      img.onerror = () => resolve(null); // 読めない形式はスキップ
      img.src = url;
    });
  }

  fileInput.addEventListener("change", async () => {
    const files = Array.from(fileInput.files || []).filter((f) => f.type.startsWith("image/") || /\.(heic|heif)$/i.test(f.name));
    fileInput.value = ""; // 同じ写真をもう一度選べるようにリセット
    if (!files.length) return;
    if (usingSamples) { revokeAll(); items = []; usingSamples = false; }

    // 先に枠だけ並べ、サムネイルは1枚ずつ順番に作る
    const added = files.map((f) => ({ url: URL.createObjectURL(f), thumb: null, sample: false }));
    items.push(...added);
    renderGrid();
    for (const it of added) {
      it.thumb = await makeThumb(it.url);
      if (it.thumb === null) {               // 表示できない画像は外す
        URL.revokeObjectURL(it.url);
        items = items.filter((x) => x !== it);
      }
      renderGrid();
    }
  });

  function revokeAll() {
    items.forEach((it) => {
      URL.revokeObjectURL(it.url);
      if (it.thumb && it.thumb !== it.url) URL.revokeObjectURL(it.thumb);
    });
  }
  clearBtn.addEventListener("click", () => { revokeAll(); loadSamples(); });

  function renderGrid() {
    grid.innerHTML = "";
    items.forEach((it, i) => {
      const d = document.createElement("div");
      d.className = "thumb";
      if (it.thumb) {
        const img = document.createElement("img");
        img.src = it.thumb; img.alt = `写真 ${i + 1}`; img.loading = "lazy";
        d.appendChild(img);
      }
      const n = document.createElement("span");
      n.className = "num"; n.textContent = i + 1;
      d.appendChild(n);
      if (!it.sample) {
        const rm = document.createElement("button");
        rm.className = "rm"; rm.type = "button"; rm.textContent = "×";
        rm.setAttribute("aria-label", `写真 ${i + 1} を外す`);
        rm.addEventListener("click", () => {
          URL.revokeObjectURL(it.url);
          if (it.thumb && it.thumb !== it.url) URL.revokeObjectURL(it.thumb);
          items = items.filter((x) => x !== it);
          if (!items.length) loadSamples(); else renderGrid();
        });
        d.appendChild(rm);
      }
      grid.appendChild(d);
    });
    sampleNote.hidden = !usingSamples;
    clearBtn.hidden = usingSamples;
    pickLabel.textContent = usingSamples ? "＋ 写真ライブラリから選ぶ" : "＋ 写真を追加する";
    photoCount.textContent = usingSamples ? "サンプル " + items.length + "枚" : items.length + "枚";
    updateSummary();
  }

  function updateSummary() {
    startBtn.disabled = items.length === 0;
    startInfo.textContent = items.length ? `${items.length}枚 × ${formatSec(getSec())}・${formatTotal(items.length * getSec())}` : "";
  }

  // ===== プレイヤー =====
  let order = [], pos = 0, playing = false, elapsed = 0, lastTs = 0, timerId = 0;
  let front = 0;            // いま表示中のレイヤー（0 か 1）
  let wakeLock = null, finished = false;
  let fadeMs = 2000;        // 今回の再生で使うフェードの長さ（ミリ秒）

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function start() {
    if (!items.length) return;
    saveSettings();
    const idx = items.map((_, i) => i);
    order = orderSel.value === "shuffle" ? shuffle(idx) : idx;
    pos = 0; elapsed = 0; finished = false;
    player.classList.toggle("fit-cover", fitSel.value === "cover");
    player.classList.toggle("trans-none", transSel.value === "none");
    // フェードが表示秒数より長いと次の写真が重なり続けるので、表示秒数の9割までに抑える
    fadeMs = Math.min(parseFloat(fadeSel.value) * 1000, getSec() * 1000 * 0.9);
    player.style.setProperty("--fade", fadeMs + "ms");
    secBadge.textContent = `1枚 ${formatSec(getSec())}`;
    layers.forEach((l) => { l.classList.remove("on", "kb"); l.removeAttribute("src"); });
    player.hidden = false;
    document.body.style.overflow = "hidden";
    // パソコンでは本物の全画面にする（iPhoneは非対応なので失敗しても無視）
    if (vmodeSel.value === "video") {
      vm = setupVideoMode();
    } else {
      try { player.requestFullscreen?.().catch(() => {}); } catch (e) {}
    }
    fsBtn.hidden = !vm;
    show(0);
    setPlaying(true);
    showHud();
  }

  function stop() {
    setPlaying(false);
    teardownVideoMode();
    player.hidden = true;
    document.body.style.overflow = "";
    try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {}
    layers.forEach((l) => { l.classList.remove("on", "kb"); l.removeAttribute("src"); });
  }

  async function show(p) {
    pos = p;
    const it = items[order[pos]];
    const back = 1 - front;
    const img = layers[back];
    img.classList.remove("kb");
    img.src = it.url;
    try { await img.decode(); } catch (e) { /* デコード失敗時もそのまま表示を試みる */ }
    if (pos !== p) return; // デコード中に別の写真へ移動していたら中止
    // ズームの向きを毎回ランダムに
    const kx = Math.random() * 6 - 3, ky = Math.random() * 6 - 3;
    if (vm) vmShow(img, kx, ky);
    if (transSel.value === "kenburns") {
      img.style.setProperty("--kx", kx.toFixed(1) + "%");
      img.style.setProperty("--ky", ky.toFixed(1) + "%");
      img.style.setProperty("--kb-dur", (getSec() * 1000 + fadeMs * 2) + "ms"); // フェードイン〜フェードアウトの間ずっと動かす
      void img.offsetWidth; // アニメーションを最初から再生させるための小技
      img.classList.add("kb");
    }
    img.classList.add("on");
    layers[front].classList.remove("on");
    front = back;
    counter.textContent = `${pos + 1} / ${order.length}`;
    // 次の写真を先に読み込んでおく（切り替えがカクつかないように）
    const nextIt = items[order[(pos + 1) % order.length]];
    if (nextIt) { const pre = new Image(); pre.src = nextIt.url; }
  }

  function next(manual) {
    if (pos + 1 >= order.length) {
      if (loopSel.value === "loop") {
        if (orderSel.value === "shuffle" && !manual) order = shuffle(order);
        show(0);
      } else if (!manual) {
        finished = true;
        setPlaying(false);
        flash("最後まで再生しました");
        showHud();
        return;
      } else return;
    } else show(pos + 1);
    elapsed = 0; finished = false;
  }
  function prev() {
    if (pos > 0) show(pos - 1);
    else if (loopSel.value === "loop") show(order.length - 1);
    elapsed = 0; finished = false;
  }

  function setPlaying(v) {
    playing = v;
    playIcon.innerHTML = v ? ICON_PAUSE : ICON_PLAY;
    playBtn.setAttribute("aria-label", v ? "一時停止" : "再生");
    // ズーム演出も一緒に止める
    layers.forEach((l) => (l.style.animationPlayState = v ? "running" : "paused"));
    clearInterval(timerId);
    if (v) {
      lastTs = performance.now();
      // 動画の全画面中は画面の描き直し合図(requestAnimationFrame)が止まることがあるので、タイマーで数える
      timerId = setInterval(tick, 50);
      requestWakeLock();
    } else {
      releaseWakeLock();
    }
  }

  // 一定間隔で経過時間を数え、指定秒数に達したら次へ
  function tick() {
    if (!playing) return;
    const now = performance.now();
    elapsed += now - lastTs;
    lastTs = now;
    if (elapsed >= getSec() * 1000) next(false);
  }

  // ===== 動画モード =====
  // canvas（お絵かき用の板）にスライドショーを描き、それを動画として <video> に流す。
  // iPhoneは <video> だけ本物の全画面にできるので、時刻や電池の表示も消える。
  let vm = null;
  function setupVideoMode() {
    const canvas = document.createElement("canvas");
    if (!canvas.captureStream) {
      flash("この端末は動画モードに対応していません");
      return null;
    }
    // 画面の向きに合わせた大きさ（長い辺は最大1920pxにして処理を軽くする）
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const sw = Math.min(screen.width, screen.height) * dpr, sh = Math.max(screen.width, screen.height) * dpr;
    const portrait = window.innerHeight >= window.innerWidth;
    let w = portrait ? sw : sh, h = portrait ? sh : sw;
    const k = Math.min(1, 1920 / Math.max(w, h));
    canvas.width = Math.round(w * k); canvas.height = Math.round(h * k);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const stream = canvas.captureStream(30);
    vmVideo.srcObject = stream;
    vmVideo.play().catch(() => {});
    const state = { canvas, ctx, stream, cur: null, prev: null, clock: 0, last: performance.now(), fs: false };
    state.timer = setInterval(() => vmRender(state), 33); // 1秒に約30回描く
    return state;
  }
  function teardownVideoMode() {
    if (!vm) return;
    clearInterval(vm.timer);
    vm.stream.getTracks().forEach((t) => t.stop());
    vmVideo.srcObject = null;
    vm = null;
    fsBtn.hidden = true;
  }
  // 写真を canvas の大きさに縮めた下絵を1回だけ作っておき、毎回の描画を軽くする
  function vmShow(img, kx, ky) {
    const { canvas } = vm;
    const W = canvas.width, H = canvas.height;
    const pre = document.createElement("canvas");
    pre.width = W; pre.height = H;
    const g = pre.getContext("2d");
    g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
    const iw = img.naturalWidth || W, ih = img.naturalHeight || H;
    const s = fitSel.value === "cover" ? Math.max(W / iw, H / ih) : Math.min(W / iw, H / ih);
    g.drawImage(img, (W - iw * s) / 2, (H - ih * s) / 2, iw * s, ih * s);
    vm.prev = vm.cur;
    vm.cur = { pre, kx, ky, t0: performance.now(), c0: vm.clock };
  }
  function vmRender(st) {
    const now = performance.now();
    if (playing) st.clock += now - st.last; // ズームは一時停止中は止める
    st.last = now;
    const { ctx, canvas } = st, W = canvas.width, H = canvas.height;
    const kb = transSel.value === "kenburns";
    const kbDur = getSec() * 1000 + fadeMs * 2;
    const draw = (sl, alpha) => {
      const p = kb ? Math.min(1, (st.clock - sl.c0) / kbDur) : 0;
      const sc = 1 + 0.12 * p;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(W / 2, H / 2);
      ctx.scale(sc, sc);
      ctx.translate(-W / 2 + (sl.kx / 100) * W * p, -H / 2 + (sl.ky / 100) * H * p);
      ctx.drawImage(sl.pre, 0, 0, W, H);
      ctx.restore();
    };
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    if (!st.cur) return;
    const a = transSel.value === "none" || fadeMs <= 0 ? 1 : Math.min(1, (now - st.cur.t0) / fadeMs);
    if (st.prev && a < 1) draw(st.prev, 1); else st.prev = null;
    draw(st.cur, a);
  }

  fsBtn.addEventListener("click", () => {
    if (!vm) return;
    try {
      if (vmVideo.webkitEnterFullscreen) vmVideo.webkitEnterFullscreen();      // iPhone
      else vmVideo.requestFullscreen().catch(() => flash("全画面にできませんでした"));
    } catch (e) {
      flash("準備中です。少し待ってからもう一度押してください");
    }
  });
  // 動画プレーヤーの再生／一時停止ボタンと、スライドショーを連動させる
  vmVideo.addEventListener("webkitbeginfullscreen", () => { if (vm) vm.fs = true; });
  vmVideo.addEventListener("webkitendfullscreen", () => {
    if (vm) vm.fs = false;
    vmVideo.play().catch(() => {}); // 全画面を閉じると動画が止まるので動かし直す
  });
  vmVideo.addEventListener("pause", () => { if (vm?.fs && playing) setPlaying(false); });
  vmVideo.addEventListener("play", () => { if (vm?.fs && !playing) setPlaying(true); });

  // ===== 画面スリープを防ぐ（対応環境のみ） =====
  async function requestWakeLock() {
    try {
      if ("wakeLock" in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } catch (e) { wakeLock = null; }
  }
  function releaseWakeLock() {
    try { wakeLock?.release(); } catch (e) {}
    wakeLock = null;
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && playing) {
      lastTs = performance.now();
      requestWakeLock();
    }
  });

  // ===== 操作パネルの表示・非表示（タップで切り替え。勝手には消えない） =====
  function showHud() { player.classList.remove("hud-hidden"); }
  function toggleHud() { player.classList.toggle("hud-hidden"); }
  function flash(msg) {
    toast.textContent = msg; toast.hidden = false;
    clearTimeout(flash.t);
    flash.t = setTimeout(() => (toast.hidden = true), 1600);
  }

  // ===== タップ・スワイプ操作 =====
  let downX = 0, downY = 0, downT = 0;
  $("stage").addEventListener("pointerdown", (e) => { downX = e.clientX; downY = e.clientY; downT = Date.now(); });
  $("stage").addEventListener("pointerup", (e) => {
    const dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      // 左にスワイプ → 次、右にスワイプ → 前
      dx < 0 ? next(true) : prev();
    } else if (Math.abs(dy) > 90 && dy > 0) {
      stop(); // 下にスワイプで閉じる
    } else if (Date.now() - downT < 400) {
      toggleHud(); // タップ1回で消える／もう1回で出る
    }
  });

  playBtn.addEventListener("click", () => {
    if (finished) { show(0); elapsed = 0; finished = false; }
    setPlaying(!playing);
  });
  $("nextBtn").addEventListener("click", () => next(true));
  $("prevBtn").addEventListener("click", () => prev());
  $("closeBtn").addEventListener("click", stop);
  startBtn.addEventListener("click", start);

  // キーボード操作（パソコン用）
  document.addEventListener("keydown", (e) => {
    if (player.hidden) return;
    if (e.key === "ArrowRight") next(true);
    else if (e.key === "ArrowLeft") prev();
    else if (e.key === " ") { e.preventDefault(); playBtn.click(); }
    else if (e.key === "Escape") stop();
  });

  // ===== 起動 =====
  loadSettings();
  syncChips();
  loadSamples();
})();
</script>
